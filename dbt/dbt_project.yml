name: 'weather_tour_dbt'
version: 2

profile: 'weather_tour_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  weather_tour_dbt:
    +materialized: ephemeral
    src:
      +materialized: view
    dim:
      +materialized: table
    fact:
      +materialized: table
    analytics:
      +materialized: table